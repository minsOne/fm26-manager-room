name: Integrated Manager Room
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'native/fm26-parser/**'
      - 'companion/macos/**'
      - 'tools/**'
      - '.github/workflows/integrated-manager-room.yml'
  push:
    branches: ['integration/read-only-manager-room', 'main']
    paths:
      - 'apps/web/**'
      - 'native/fm26-parser/**'
      - 'companion/macos/**'
      - 'tools/**'
      - '.github/workflows/integrated-manager-room.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-manager-room-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-save-browser:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and conversion regression suites
        run: |
          npm --prefix apps/web test
          npm --prefix apps/web run check
          node --check apps/web/engine/realSnapshot.js
          python -m py_compile tools/test_integrated_manager_room.py
          python -m unittest discover -s tools/tests -p 'test_snapshot_field_audit.py' -v
          cargo test --manifest-path native/fm26-parser/Cargo.toml
          bash tools/test_companion_core.sh
      - name: Build actual Rust parser and hardened macOS companion
        run: |
          cargo build --release --manifest-path native/fm26-parser/Cargo.toml
          swift build --package-path companion/macos -c release
      - name: Verify HTTP security boundary
        run: python tools/test_companion_http.py --binary companion/macos/.build/release/manager-room-companion
      - name: Install pinned reference and browser runners
        run: |
          python -m pip install 'gdown==5.2.0' 'playwright==1.57.0'
          python -m pip install 'git+https://github.com/rhiever/fmsave.git@97ac7fe5991fa93f05e42e32f02f37e4c1874d61'
          python -m playwright install chromium webkit
      - name: Download public test save privately
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/integrated-mr"
          python -m gdown 1UZlBHKpEae416lx8apbkug-pmZH7RMKd -O "$RUNNER_TEMP/integrated-mr/public.fm"
          test -s "$RUNNER_TEMP/integrated-mr/public.fm"
      - name: Audit published native fields against pinned fmsave
        run: |
          native/fm26-parser/target/release/fm26-manager-room-parser snapshot "$RUNNER_TEMP/integrated-mr/public.fm" > "$RUNNER_TEMP/integrated-mr/snapshot.json"
          python tools/verify_snapshot_fields.py --save "$RUNNER_TEMP/integrated-mr/public.fm" --snapshot "$RUNNER_TEMP/integrated-mr/snapshot.json" --report "$RUNNER_TEMP/integrated-mr/fields-report.json"
      - name: Real filesystem and HTTP to Chromium and WebKit
        run: |
          python tools/test_integrated_manager_room.py --save "$RUNNER_TEMP/integrated-mr/public.fm" --native-snapshot "$RUNNER_TEMP/integrated-mr/snapshot.json" --parser native/fm26-parser/target/release/fm26-manager-room-parser --companion companion/macos/.build/release/manager-room-companion --report "$RUNNER_TEMP/integrated-mr/browser-report.json"
      - name: Remove save and player JSON
        if: always()
        run: rm -f "$RUNNER_TEMP/integrated-mr/public.fm" "$RUNNER_TEMP/integrated-mr/snapshot.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-manager-room-sanitized
          path: |
            ${{ runner.temp }}/integrated-mr/fields-report.json
            ${{ runner.temp }}/integrated-mr/browser-report.json
          if-no-files-found: warn
          retention-days: 7
