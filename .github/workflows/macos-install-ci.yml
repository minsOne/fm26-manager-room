name: macOS Install CI

on:
  pull_request:
    paths:
      - "scripts/install-macos.sh"
      - "scripts/uninstall-macos.sh"
      - "scripts/uninstall-macos.sh"
      - "companion/macos/**"
      - "native/fm26-parser/**"
      - ".github/workflows/macos-install-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/install-macos.sh"
      - "companion/macos/**"
      - "native/fm26-parser/**"
      - ".github/workflows/macos-install-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install from source into isolated application home
        env:
          FM26_MANAGER_ROOM_HOME: ${{ runner.temp }}/manager-room-home
          FM26_MANAGER_ROOM_SHIM_DIR: ${{ runner.temp }}/manager-room-shim
        run: bash scripts/install-macos.sh

      - name: Verify installed binaries and diagnostics
        env:
          FM26_MANAGER_ROOM_HOME: ${{ runner.temp }}/manager-room-home
          FM26_MANAGER_ROOM_SHIM_DIR: ${{ runner.temp }}/manager-room-shim
        run: |
          BIN="$FM26_MANAGER_ROOM_HOME/bin"
          test -x "$BIN/manager-room"
          test -x "$BIN/fm26-manager-room-parser"
          test -L "$FM26_MANAGER_ROOM_SHIM_DIR/manager-room"
          test -x "$FM26_MANAGER_ROOM_SHIM_DIR/manager-room"
          "$BIN/manager-room" doctor > "$RUNNER_TEMP/doctor-before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("doctor-before.json").read_text())
          assert d["platform"]=="macOS"
          assert d["parserAvailable"] is True
          assert d.get("selectionId") is None
          assert d["snapshotPath"].startswith(os.environ["FM26_MANAGER_ROOM_HOME"])
          PY

      - name: Verify pin, persistence and clear commands
        env:
          FM26_MANAGER_ROOM_HOME: ${{ runner.temp }}/manager-room-home
        run: |
          BIN="$FM26_MANAGER_ROOM_HOME/bin"
          SAVE="$RUNNER_TEMP/Install Test Career.fm"
          printf 'nonempty test save' > "$SAVE"
          "$BIN/manager-room" pin-save "$SAVE" > "$RUNNER_TEMP/pin.json"
          "$BIN/manager-room" selection > "$RUNNER_TEMP/selection.json"
          "$BIN/manager-room" doctor > "$RUNNER_TEMP/doctor-pinned.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          pin=json.loads((root/"pin.json").read_text())
          selected=json.loads((root/"selection.json").read_text())
          doctor=json.loads((root/"doctor-pinned.json").read_text())
          assert pin["id"] == selected["id"] == doctor["selectionId"]
          assert doctor["selectedSaveExists"] is True
          assert doctor["selectedSavePath"].endswith("Install Test Career.fm")
          PY
          "$BIN/manager-room" unpin-save
          test "$("$BIN/manager-room" selection)" = "{}"

      - name: Verify ad-hoc signatures
        env:
          FM26_MANAGER_ROOM_HOME: ${{ runner.temp }}/manager-room-home
        run: |
          codesign --verify "$FM26_MANAGER_ROOM_HOME/bin/manager-room"
          codesign --verify "$FM26_MANAGER_ROOM_HOME/bin/fm26-manager-room-parser"

      - name: Verify installed loopback service
        env:
          FM26_MANAGER_ROOM_HOME: ${{ runner.temp }}/manager-room-home
          FM26_MANAGER_ROOM_SHIM_DIR: ${{ runner.temp }}/manager-room-shim
        run: |
          "$FM26_MANAGER_ROOM_HOME/bin/manager-room" serve             --parser "$FM26_MANAGER_ROOM_HOME/bin/fm26-manager-room-parser"             --save-dir "$RUNNER_TEMP" --no-watch --port 18765             > "$RUNNER_TEMP/install-service.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, time, urllib.request
          url="http://127.0.0.1:18765/api/health"
          for _ in range(80):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      data=json.load(response)
                  assert data["status"] == "ok"
                  assert data["platform"] == "macOS"
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("installed service did not become healthy")
          PY
          kill "$PID"
          wait "$PID" || true
          trap - EXIT

      - name: Verify uninstall preserves selection unless purged
        env:
          FM26_MANAGER_ROOM_HOME: ${{ runner.temp }}/manager-room-home
          FM26_MANAGER_ROOM_SHIM_DIR: ${{ runner.temp }}/manager-room-shim
        run: |
          test -f "$FM26_MANAGER_ROOM_HOME/selection.json"
          bash scripts/uninstall-macos.sh
          test ! -e "$FM26_MANAGER_ROOM_HOME/bin/manager-room"
          test ! -e "$FM26_MANAGER_ROOM_SHIM_DIR/manager-room"
          test -f "$FM26_MANAGER_ROOM_HOME/selection.json"
          bash scripts/uninstall-macos.sh --purge-data
          test ! -e "$FM26_MANAGER_ROOM_HOME"
