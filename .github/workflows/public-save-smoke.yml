name: Public FM26 Save Smoke Test

on:
  push:
    branches:
      - "feature/manager-room-mvp"
    paths:
      - "tools/fmsave_to_snapshot.py"
      - ".github/workflows/public-save-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-real-save:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned FM26 parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdown==5.2.0"
          python -m pip install "git+https://github.com/rhiever/fmsave.git@97ac7fe5991fa93f05e42e32f02f37e4c1874d61"

      - name: Download public FC St Helens FM26 challenge save
        run: |
          mkdir -p /tmp/fm26-smoke
          python -m gdown --id 1UZlBHKpEae416lx8apbkug-pmZH7RMKd -O /tmp/fm26-smoke/public.fm
          test -s /tmp/fm26-smoke/public.fm
          ls -lh /tmp/fm26-smoke/public.fm

      - name: Read save metadata
        run: |
          fmsave info /tmp/fm26-smoke/public.fm --json > /tmp/fm26-smoke/info.json
          cat /tmp/fm26-smoke/info.json

      - name: Validate all fmsave readers
        continue-on-error: true
        run: |
          fmsave validate /tmp/fm26-smoke/public.fm --json > /tmp/fm26-smoke/validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/fm26-smoke/validation.json").read_text())
          print(json.dumps(report, indent=2)[:12000])
          PY

      - name: Convert to Manager Room snapshot
        run: |
          python tools/fmsave_to_snapshot.py             /tmp/fm26-smoke/public.fm             --output /tmp/fm26-smoke/snapshot.json             --summary /tmp/fm26-smoke/summary.json
          cat /tmp/fm26-smoke/summary.json

      - name: Assert usable real-save snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("/tmp/fm26-smoke/snapshot.json").read_text())
          assert s["meta"]["game"] == "FM26", s["meta"]
          assert len(s["players"]) >= 11, len(s["players"])
          assert s["manager"]["club"], s["manager"]
          assert len(s["fixtures"]) >= 1, "No upcoming managed-club fixtures"
          assert s["sourceData"]["financeRows"] > 0, s["sourceData"]
          assert all(1 <= p["ca"] <= 200 for p in s["players"])
          assert all(1 <= p["pa"] <= 200 for p in s["players"])
          print("Real FM26 snapshot assertions passed.")
          PY

      - name: Produce sanitized smoke report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/fm26-smoke")
          report = {}
          for name in ("info", "summary"):
              path = root / f"{name}.json"
              if path.exists():
                  report[name] = json.loads(path.read_text())
          validation = root / "validation.json"
          if validation.exists():
              report["validation"] = json.loads(validation.read_text())
          (root / "smoke-report.json").write_text(json.dumps(report, indent=2))
          PY
          rm -f /tmp/fm26-smoke/public.fm /tmp/fm26-smoke/snapshot.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-fm26-save-smoke-report
          path: |
            /tmp/fm26-smoke/smoke-report.json
          if-no-files-found: error
          retention-days: 7
