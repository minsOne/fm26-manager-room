name: Rust Parser CI

on:
  pull_request:
    paths:
      - "native/fm26-parser/**"
      - "tools/benchmark_fmsave_section.py"
      - "tools/benchmark_fmsave_players.py"
      - ".github/workflows/rust-parser-ci.yml"
  push:
    branches:
      - "perf/rust-parser-core"
      - "perf/rust-player-semantics"
      - "perf/rust-contracts"
      - "feature/rust-quick-snapshot"
    paths:
      - "native/fm26-parser/**"
      - "tools/benchmark_fmsave_section.py"
      - "tools/benchmark_fmsave_players.py"
      - ".github/workflows/rust-parser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Check
        run: cargo check --manifest-path native/fm26-parser/Cargo.toml

      - name: Build release
        run: cargo build --release --manifest-path native/fm26-parser/Cargo.toml

  benchmark-public-save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdown==5.2.0"
          python -m pip install "git+https://github.com/rhiever/fmsave.git@97ac7fe5991fa93f05e42e32f02f37e4c1874d61"

      - name: Download public FM26 save
        run: |
          mkdir -p /tmp/fm26-rust-bench
          python -m gdown --id 1UZlBHKpEae416lx8apbkug-pmZH7RMKd -O /tmp/fm26-rust-bench/public.fm
          test -s /tmp/fm26-rust-bench/public.fm
          ls -lh /tmp/fm26-rust-bench/public.fm

      - name: Build Rust parser
        run: cargo build --release --manifest-path native/fm26-parser/Cargo.toml

      - name: Benchmark Python container/decompression
        run: |
          python tools/benchmark_fmsave_section.py /tmp/fm26-rust-bench/public.fm             > /tmp/fm26-rust-bench/python.json
          cat /tmp/fm26-rust-bench/python.json

      - name: Benchmark Python full player reader
        run: |
          python tools/benchmark_fmsave_players.py /tmp/fm26-rust-bench/public.fm             > /tmp/fm26-rust-bench/python-players.json
          cat /tmp/fm26-rust-bench/python-players.json

      - name: Benchmark Rust container/decompression/player scan
        run: |
          native/fm26-parser/target/release/fm26-manager-room-parser             bench /tmp/fm26-rust-bench/public.fm             > /tmp/fm26-rust-bench/rust.json
          cat /tmp/fm26-rust-bench/rust.json

      - name: Generate Rust managed-club quick snapshot
        run: |
          native/fm26-parser/target/release/fm26-manager-room-parser \
            snapshot /tmp/fm26-rust-bench/public.fm \
            > /tmp/fm26-rust-bench/quick-snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/fm26-rust-bench")
          snapshot = json.loads((root / "quick-snapshot.json").read_text())
          reference = json.loads((root / "python-players.json").read_text())

          players = snapshot["players"]
          assert snapshot["manager"]["clubUid"] == reference["managedClubUid"]
          assert snapshot["manager"]["club"] == reference["managedClubName"]
          assert snapshot["manager"]["name"] == reference["managerName"]
          assert len(players) == reference["managedPlayerCount"]
          assert sum(int(player["id"]) for player in players) == reference["managedPlayerUidSum"]
          assert sum(player["ca"] for player in players) == reference["managedPlayerCaSum"]
          assert sum(player["wage"] for player in players) == reference["managedPlayerWageSum"]

          value = 0xCBF29CE484222325
          prime = 0x100000001B3
          mask = (1 << 64) - 1
          def update(value, data):
              for byte in data:
                  value ^= byte
                  value = (value * prime) & mask
              return value

          for player in sorted(players, key=lambda item: int(item["id"])):
              value = update(value, int(player["id"]).to_bytes(4, "little"))
              value = update(value, player["name"].encode("utf-8"))
              value = update(value, b"\xff")

          assert value == reference["managedPlayerNameHashFnv1a64"]
          assert snapshot["schemaVersion"] == 2
          assert sum(player["playingTime"]["recentMinutes"] for player in players) == reference["managedRecent14Sum"]
          assert sum(player["playingTime"]["minutesLast5"] for player in players) == reference["managedRecent5Sum"]

          finance = snapshot["clubFinance"]
          if reference["managedFinanceBalance"] is None:
              assert finance is None
          else:
              assert finance["balance"] == reference["managedFinanceBalance"]
              assert finance["transferBudgetAllocated"] == reference["managedFinanceTransferAllocated"]
              assert finance["transferBudgetRemaining"] == reference["managedFinanceTransferRemaining"]
              assert finance["wageBudgetWeekly"] == reference["managedFinanceWageBudget"]
              assert finance["wagePayrollWeekly"] == reference["managedFinanceWagePayroll"]
              assert finance["financeRows"] == reference["managedFinanceRows"]

          assert len(snapshot["fixtures"]) == reference["managedUpcomingFixtureCount"]
          fixture_hash = 0xCBF29CE484222325
          import datetime
          for fixture in snapshot["fixtures"]:
              y, m, d = map(int, fixture["date"].split("-"))
              day = datetime.date(y, m, d).timetuple().tm_yday
              date_code = y * 1000 + day
              fixture_hash = update(fixture_hash, date_code.to_bytes(8, "little"))
              fixture_hash = update(fixture_hash, int(fixture["homeTeamId"]).to_bytes(4, "little"))
              fixture_hash = update(fixture_hash, int(fixture["awayTeamId"]).to_bytes(4, "little"))
              fixture_hash = update(fixture_hash, bytes([1 if fixture["home"] else 0]))
              fixture_hash = update(
                  fixture_hash, int(fixture.get("opponentClubUid") or 0).to_bytes(4, "little")
              )
          assert fixture_hash == reference["managedUpcomingFixtureHash"]

          fixture_competition_hash = 0xCBF29CE484222325
          for fixture in snapshot["fixtures"]:
              fixture_competition_hash = update(
                  fixture_competition_hash,
                  int(fixture.get("competitionId") or 0).to_bytes(4, "little")
              )
              fixture_competition_hash = update(
                  fixture_competition_hash,
                  int(fixture.get("competitionDatabaseId") or 0).to_bytes(4, "little")
              )
              fixture_competition_hash = update(
                  fixture_competition_hash,
                  int(fixture.get("roundRaw") or 0).to_bytes(4, "little")
              )
          assert fixture_competition_hash == reference["managedUpcomingCompetitionHash"]

          print(json.dumps({
              "club": snapshot["manager"]["club"],
              "players": len(players),
              "caSum": sum(player["ca"] for player in players),
              "wageSum": sum(player["wage"] for player in players),
              "source": snapshot["source"],
          }, indent=2))
          PY

      - name: Compare timings and correctness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/fm26-rust-bench")
          py = json.loads((root / "python.json").read_text())
          py_players = json.loads((root / "python-players.json").read_text())
          rs = json.loads((root / "rust.json").read_text())

          assert py["gameDbDecompressedBytes"] == rs["gameDbDecompressedBytes"]
          assert rs["playerScan"]["totalCandidates"] == py_players["playerCount"]
          assert rs["playerScan"]["currentAbilitySum"] == py_players["currentAbilitySum"]
          assert rs["playerScan"]["potentialAbilityRawSum"] == py_players["potentialAbilityRawSum"]
          assert rs["playerScan"]["positionRatingSum"] == py_players["positionRatingSum"]
          assert rs["playerScan"]["rawAttributeSum"] == py_players["rawAttributeSum"]
          assert rs["playerScan"]["rawLeftFootSum"] == py_players["rawLeftFootSum"]
          assert rs["playerScan"]["rawRightFootSum"] == py_players["rawRightFootSum"]
          assert rs["playerScan"]["transferValueSum"] == py_players["transferValueSum"]
          assert rs["playerScan"]["rawMatchSharpnessSum"] == py_players["rawMatchSharpnessSum"]
          assert rs["playerScan"]["rawConditionSum"] == py_players["rawConditionSum"]
          assert rs["playerScan"]["heightSum"] == py_players["heightSum"]
          assert rs["personDecode"]["decoded"] == py_players["personDecoded"]
          assert rs["personDecode"]["missing"] == py_players["personMissing"]
          assert rs["personDecode"]["namePresent"] == py_players["namePresent"]
          assert rs["personDecode"]["nameHashFnv1a64"] == py_players["nameHashFnv1a64"]
          assert rs["personDecode"]["birthYearSum"] == py_players["birthYearSum"]
          assert rs["personDecode"]["birthDaySum"] == py_players["birthDaySum"]
          assert rs["personDecode"]["nationIdSum"] == py_players["nationIdSum"]
          assert rs["personDecode"]["personalitySums"] == py_players["personalitySums"]
          assert rs["personDecode"]["traitBitsXor"] == py_players["traitBitsXor"]
          assert rs["personDecode"]["traitPopcountSum"] == py_players["traitPopcountSum"]
          assert rs["clubScan"]["clubs"] == py_players["clubCount"]
          assert rs["clubScan"]["uidSum"] == py_players["clubUidSum"]
          assert rs["clubScan"]["nationSum"] == py_players["clubNationSum"]
          assert rs["clubScan"]["nameHashFnv1a64"] == py_players["clubNameHashFnv1a64"]
          assert rs["playerClubJoin"]["withTeam"] == py_players["teamPresent"]
          assert rs["playerClubJoin"]["teamResolved"] == py_players["teamResolved"]
          assert rs["playerClubJoin"]["teamIdSum"] == py_players["teamIdSum"]
          assert rs["playerClubJoin"]["clubUidSum"] == py_players["resolvedClubUidSum"]
          assert rs["playerClubJoin"]["clubNationSum"] == py_players["resolvedClubNationSum"]
          assert rs["playerClubJoin"]["clubNameHashFnv1a64"] == py_players["resolvedClubNameHashFnv1a64"]
          assert rs["playerClubJoin"]["affiliateRegistrationCount"] == py_players["affiliateRegistrationCount"]
          assert rs["gameInfo"]["gameDate"]["year"] == py_players["gameDateYear"]
          assert rs["gameInfo"]["gameDate"]["dayOfYear"] == py_players["gameDateDay"]
          assert rs["gameInfo"]["dbVersion"] == py_players["dbVersion"]
          assert rs["summary"]["clubUid"] == py_players["managedClubUid"]
          assert rs["summary"]["clubName"] == py_players["managedClubName"]
          assert rs["summary"]["managerName"] == py_players["managerName"]
          assert rs["contracts"]["playersWithChain"] == py_players["playersWithChain"]
          assert rs["contracts"]["chainRecords"] == py_players["chainRecords"]
          assert rs["contracts"]["chainTeamsResolved"] == py_players["chainTeamsResolved"]
          assert rs["contracts"]["tailsParsed"] == py_players["tailsParsed"]
          assert rs["contracts"]["chainWageSum"] == py_players["chainWageSum"]
          assert rs["contracts"]["chainStartDateSum"] == py_players["chainStartDateSum"]
          assert rs["contracts"]["chainEndDateSum"] == py_players["chainEndDateSum"]
          assert rs["contracts"]["currentFromChain"] == py_players["currentFromChain"]
          assert rs["contracts"]["currentWithTerms"] == py_players["currentWithTerms"]
          assert rs["contracts"]["currentWageSum"] == py_players["currentWageSum"]
          assert rs["contracts"]["currentEndDateSum"] == py_players["currentEndDateSum"]
          assert rs["contracts"]["currentSquadStatusSum"] == py_players["currentSquadStatusSum"]
          assert rs["contracts"]["currentClubUidSum"] == py_players["currentClubUidSum"]
          assert rs["contracts"]["currentTeamIdSum"] == py_players["currentTeamIdSum"]
          assert rs["matchHistory"]["retainedRecords"] == py_players["matchStatRows"]
          assert rs["matchHistory"]["recordsWithStats"] == py_players["matchRowsWithStats"]
          assert rs["matchHistory"]["playersWithHistory"] == py_players["recentMinutesKnownPlayers"]
          assert rs["matchHistory"]["last14Sum"] == py_players["recent14Sum"]
          assert rs["matchHistory"]["last5Sum"] == py_players["recent5Sum"]
          assert rs["finance"]["clubsWithSeries"] == py_players["financeLatestClubs"]
          assert rs["finance"]["totalRows"] == py_players["financeRows"]
          assert rs["finance"]["balanceSum"] == py_players["financeBalanceSum"]
          assert rs["finance"]["transferAllocatedSum"] == py_players["financeTransferAllocatedSum"]
          assert rs["finance"]["transferRemainingSum"] == py_players["financeTransferRemainingSum"]
          assert rs["finance"]["wageBudgetSum"] == py_players["financeWageBudgetSum"]
          assert rs["finance"]["wagePayrollSum"] == py_players["financeWagePayrollSum"]
          assert rs["finance"]["netSum"] == py_players["financeNetSum"]
          assert rs["stages"]["rows"] == py_players["stageCount"]
          assert rs["stages"]["idSum"] == py_players["stageIdSum"]
          assert rs["stages"]["competitionIdSum"] == py_players["stageCompetitionIdSum"]
          assert rs["stages"]["roundRawSum"] == py_players["stageRoundRawSum"]
          assert rs["competitions"]["competitions"] == py_players["competitionCount"]
          assert rs["competitions"]["withDatabaseId"] == py_players["competitionWithDatabaseId"]
          assert rs["competitions"]["databaseIdSum"] == py_players["competitionDatabaseIdSum"]
          assert rs["fixtures"]["managedUpcoming"] == py_players["managedUpcomingFixtureCount"]

          comparison = {
              "fileMiB": round(py["fileBytes"] / 1024 / 1024, 1),
              "gameDbMiB": round(py["gameDbDecompressedBytes"] / 1024 / 1024, 1),
              "pythonContainer": {
                  "indexMs": py["indexMs"],
                  "decompressGameDbMs": py["decompressGameDbMs"],
                  "totalMs": py["totalMs"],
              },
              "pythonPlayers": {
                  "openMs": py_players["openMs"],
                  "playersMs": py_players["playersMs"],
                  "playerCount": py_players["playerCount"],
              },
              "rust": {
                  "indexMs": round(rs["indexMs"], 3),
                  "decompressGameDbMs": round(rs["decompressGameDbMs"], 3),
                  "playerScanMs": round(rs["playerScanMs"], 3),
                  "namePoolMs": round(rs["namePoolMs"], 3),
                  "personDecodeMs": round(rs["personDecodeMs"], 3),
                  "clubScanMs": round(rs["clubScanMs"], 3),
                  "gameInfoMs": round(rs["gameInfoMs"], 3),
                  "contractDecodeMs": round(rs["contractDecodeMs"], 3),
                  "matchHistoryMs": round(rs["matchHistoryMs"], 3),
                  "financeMs": round(rs["financeMs"], 3),
                  "spanDecompressMs": round(rs["spanDecompressMs"], 3),
                  "fixtureMs": round(rs["fixtureMs"], 3),
                  "stageMs": round(rs["stageMs"], 3),
                  "competitionMs": round(rs["competitionMs"], 3),
                  "semanticPlayerMs": round(
                      rs["playerScanMs"] + rs["namePoolMs"] + rs["personDecodeMs"] + rs["clubScanMs"] + rs["gameInfoMs"] + rs["contractDecodeMs"] + rs["matchHistoryMs"] + rs["financeMs"] + rs["fixtureMs"], 3
                  ),
                  "totalMs": round(rs["totalMs"], 3),
                  "playerCandidates": rs["playerScan"]["totalCandidates"],
              },
              "decompressionSpeedup": round(
                  py["decompressGameDbMs"] / max(rs["decompressGameDbMs"], 0.001), 2
              ),
              "playerDiscoverySpeedup": round(
                  py_players["playersMs"] / max(rs["playerScanMs"], 0.001), 2
              ),
              "correctness": {
                  "playerCountEqual": True,
                  "currentAbilitySumEqual": True,
                  "potentialAbilityRawSumEqual": True,
                  "positionRatingSumEqual": True,
                  "rawAttributeSumEqual": True,
                  "feetSumEqual": True,
                  "transferValueSumEqual": True,
                  "sharpnessSumEqual": True,
                  "conditionSumEqual": True,
                  "heightSumEqual": True,
                  "personDecodedEqual": True,
                  "nameHashEqual": True,
                  "birthDateEqual": True,
                  "nationEqual": True,
                  "personalityEqual": True,
                  "traitBitsEqual": True,
                  "clubsEqual": True,
                  "clubNamesEqual": True,
                  "teamResolutionEqual": True,
                  "affiliateResolutionEqual": True,
                  "gameDateEqual": True,
                  "contractChainEqual": True,
                  "currentContractEqual": True,
                  "recentMinutesEqual": True,
                  "financeEqual": True,
                  "managedFixturesEqual": True,
                  "stageTableEqual": True,
                  "competitionIdsEqual": True,
                  "fixtureCompetitionJoinEqual": True,
              },
          }
          (root / "comparison.json").write_text(json.dumps(comparison, indent=2))
          print(json.dumps(comparison, indent=2))
          PY

      - name: Remove original save
        if: always()
        run: rm -f /tmp/fm26-rust-bench/public.fm

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-parser-benchmark
          path: |
            /tmp/fm26-rust-bench/python.json
            /tmp/fm26-rust-bench/python-players.json
            /tmp/fm26-rust-bench/rust.json
            /tmp/fm26-rust-bench/comparison.json
            /tmp/fm26-rust-bench/quick-snapshot.json
          if-no-files-found: warn
          retention-days: 7
