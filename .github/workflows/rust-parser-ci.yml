name: Rust Parser CI

on:
  pull_request:
    paths:
      - "native/fm26-parser/**"
      - "tools/benchmark_fmsave_section.py"
      - "tools/benchmark_fmsave_players.py"
      - ".github/workflows/rust-parser-ci.yml"
  push:
    branches:
      - "perf/rust-parser-core"
      - "perf/rust-player-semantics"
      - "perf/rust-semantic-player-reader"
    paths:
      - "native/fm26-parser/**"
      - "tools/benchmark_fmsave_section.py"
      - "tools/benchmark_fmsave_players.py"
      - ".github/workflows/rust-parser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Check
        run: cargo check --manifest-path native/fm26-parser/Cargo.toml

      - name: Build release
        run: cargo build --release --manifest-path native/fm26-parser/Cargo.toml

  benchmark-public-save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdown==5.2.0"
          python -m pip install "git+https://github.com/rhiever/fmsave.git@97ac7fe5991fa93f05e42e32f02f37e4c1874d61"

      - name: Download public FM26 save
        run: |
          mkdir -p /tmp/fm26-rust-bench
          python -m gdown --id 1UZlBHKpEae416lx8apbkug-pmZH7RMKd -O /tmp/fm26-rust-bench/public.fm
          test -s /tmp/fm26-rust-bench/public.fm
          ls -lh /tmp/fm26-rust-bench/public.fm

      - name: Build Rust parser
        run: cargo build --release --manifest-path native/fm26-parser/Cargo.toml

      - name: Benchmark Python container/decompression
        run: |
          python tools/benchmark_fmsave_section.py /tmp/fm26-rust-bench/public.fm             > /tmp/fm26-rust-bench/python.json
          cat /tmp/fm26-rust-bench/python.json

      - name: Benchmark Python full player reader
        run: |
          python tools/benchmark_fmsave_players.py /tmp/fm26-rust-bench/public.fm             > /tmp/fm26-rust-bench/python-players.json
          cat /tmp/fm26-rust-bench/python-players.json

      - name: Benchmark Rust semantic player + contract reader
        run: |
          CLOCK=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("/tmp/fm26-rust-bench/python-players.json").read_text())["gameDate"])
          PY
          )
          native/fm26-parser/target/release/fm26-manager-room-parser \
            bench /tmp/fm26-rust-bench/public.fm --clock "$CLOCK" \
            > /tmp/fm26-rust-bench/rust.json
          cat /tmp/fm26-rust-bench/rust.json

      - name: Generate native Manager Room snapshot
        run: |
          CLOCK=$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/fm26-rust-bench/python-players.json").read_text())
          print(data["gameDate"])
          PY
          )
          native/fm26-parser/target/release/fm26-manager-room-parser \
            snapshot /tmp/fm26-rust-bench/public.fm --clock "$CLOCK" \
            > /tmp/fm26-rust-bench/rust-snapshot.json

      - name: Compare timings and correctness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/fm26-rust-bench")
          py = json.loads((root / "python.json").read_text())
          py_players = json.loads((root / "python-players.json").read_text())
          rs = json.loads((root / "rust.json").read_text())
          snapshot = json.loads((root / "rust-snapshot.json").read_text())

          assert py["gameDbDecompressedBytes"] == rs["gameDbDecompressedBytes"]
          assert rs["playerScan"]["totalCandidates"] == py_players["playerCount"]
          assert rs["playerScan"]["currentAbilitySum"] == py_players["currentAbilitySum"]
          assert rs["playerScan"]["potentialAbilityRawSum"] == py_players["potentialAbilityRawSum"]
          assert rs["playerScan"]["positionRatingSum"] == py_players["positionRatingSum"]
          assert rs["playerScan"]["rawAttributeSum"] == py_players["rawAttributeSum"]
          assert rs["playerScan"]["rawLeftFootSum"] == py_players["rawLeftFootSum"]
          assert rs["playerScan"]["rawRightFootSum"] == py_players["rawRightFootSum"]
          assert rs["playerScan"]["transferValueSum"] == py_players["transferValueSum"]
          assert rs["playerScan"]["rawMatchSharpnessSum"] == py_players["rawMatchSharpnessSum"]
          assert rs["playerScan"]["rawConditionSum"] == py_players["rawConditionSum"]
          assert rs["playerScan"]["heightSum"] == py_players["heightSum"]
          assert rs["personDecode"]["decoded"] == py_players["personDecoded"]
          assert rs["personDecode"]["missing"] == py_players["personMissing"]
          assert rs["personDecode"]["namePresent"] == py_players["namePresent"]
          assert rs["personDecode"]["nameHashFnv1a64"] == py_players["nameHashFnv1a64"]
          assert rs["personDecode"]["birthYearSum"] == py_players["birthYearSum"]
          assert rs["personDecode"]["birthDaySum"] == py_players["birthDaySum"]
          assert rs["personDecode"]["nationIdSum"] == py_players["nationIdSum"]
          assert rs["personDecode"]["personalitySums"] == py_players["personalitySums"]
          assert rs["personDecode"]["traitBitsXor"] == py_players["traitBitsXor"]
          assert rs["personDecode"]["traitPopcountSum"] == py_players["traitPopcountSum"]
          assert rs["clubScan"]["clubs"] == py_players["clubCount"]
          assert rs["clubScan"]["uidSum"] == py_players["clubUidSum"]
          assert rs["clubScan"]["nationSum"] == py_players["clubNationSum"]
          assert rs["clubScan"]["nameHashFnv1a64"] == py_players["clubNameHashFnv1a64"]
          assert rs["playerClubJoin"]["withTeam"] == py_players["teamPresent"]
          assert rs["playerClubJoin"]["teamResolved"] == py_players["teamResolved"]
          assert rs["playerClubJoin"]["teamIdSum"] == py_players["teamIdSum"]
          assert rs["playerClubJoin"]["clubUidSum"] == py_players["resolvedClubUidSum"]
          assert rs["playerClubJoin"]["clubNationSum"] == py_players["resolvedClubNationSum"]
          assert rs["playerClubJoin"]["clubNameHashFnv1a64"] == py_players["resolvedClubNameHashFnv1a64"]
          assert rs["playerClubJoin"]["affiliateRegistrationCount"] == py_players["affiliateRegistrationCount"]
          assert rs["contracts"]["contracts"] == py_players["contractCount"]
          assert rs["contracts"]["wagePresent"] == py_players["contractWagePresent"]
          assert rs["contracts"]["wageSum"] == py_players["contractWageSum"]
          assert rs["contracts"]["startPresent"] == py_players["contractStartPresent"]
          assert rs["contracts"]["startCodeSum"] == py_players["contractStartCodeSum"]
          assert rs["contracts"]["endPresent"] == py_players["contractEndPresent"]
          assert rs["contracts"]["endCodeSum"] == py_players["contractEndCodeSum"]
          assert rs["contracts"]["squadStatusPresent"] == py_players["contractSquadStatusPresent"]
          assert rs["contracts"]["squadStatusSum"] == py_players["contractSquadStatusSum"]
          assert rs["contracts"]["eventCountSum"] == py_players["contractEventCountSum"]
          assert rs["contracts"]["teamIdSum"] == py_players["contractTeamIdSum"]
          assert rs["contracts"]["clubUidSum"] == py_players["contractClubUidSum"]
          assert snapshot["manager"]["clubUid"] == py_players["managedClubUid"]
          assert snapshot["manager"]["club"] == py_players["managedClubName"]
          assert len(snapshot["players"]) == py_players["managedSquadCount"]

          FNV_PRIME = 0x100000001B3
          MASK64 = (1 << 64) - 1
          def fnv(value, data):
              for byte in data:
                  value ^= byte
                  value = (value * FNV_PRIME) & MASK64
              return value

          snapshot_hash = 0xCBF29CE484222325
          for player in sorted(snapshot["players"], key=lambda value: int(value["id"])):
              snapshot_hash = fnv(snapshot_hash, int(player["id"]).to_bytes(4, "little"))
              snapshot_hash = fnv(snapshot_hash, player["name"].encode("utf-8") + b"\xff")
              snapshot_hash = fnv(snapshot_hash, int(player["ca"]).to_bytes(2, "little"))
              snapshot_hash = fnv(snapshot_hash, int(player["pa"]).to_bytes(2, "little"))
              snapshot_hash = fnv(snapshot_hash, int(player["value"]).to_bytes(4, "little"))
              snapshot_hash = fnv(snapshot_hash, int(player["wage"]).to_bytes(4, "little"))
          assert snapshot_hash == py_players["managedPlayerSnapshotHash"]

          comparison = {
              "fileMiB": round(py["fileBytes"] / 1024 / 1024, 1),
              "gameDbMiB": round(py["gameDbDecompressedBytes"] / 1024 / 1024, 1),
              "pythonContainer": {
                  "indexMs": py["indexMs"],
                  "decompressGameDbMs": py["decompressGameDbMs"],
                  "totalMs": py["totalMs"],
              },
              "pythonPlayers": {
                  "openMs": py_players["openMs"],
                  "playersMs": py_players["playersMs"],
                  "playerCount": py_players["playerCount"],
              },
              "rust": {
                  "indexMs": round(rs["indexMs"], 3),
                  "decompressGameDbMs": round(rs["decompressGameDbMs"], 3),
                  "playerScanMs": round(rs["playerScanMs"], 3),
                  "namePoolMs": round(rs["namePoolMs"], 3),
                  "personDecodeMs": round(rs["personDecodeMs"], 3),
                  "clubScanMs": round(rs["clubScanMs"], 3),
                  "contractMs": round(rs["contractMs"], 3),
                  "semanticPlayerMs": round(
                      rs["playerScanMs"] + rs["namePoolMs"] + rs["personDecodeMs"] + rs["clubScanMs"] + rs["contractMs"], 3
                  ),
                  "totalMs": round(rs["totalMs"], 3),
                  "playerCandidates": rs["playerScan"]["totalCandidates"],
              },
              "decompressionSpeedup": round(
                  py["decompressGameDbMs"] / max(rs["decompressGameDbMs"], 0.001), 2
              ),
              "playerDiscoverySpeedup": round(
                  py_players["playersMs"] / max(rs["playerScanMs"], 0.001), 2
              ),
              "correctness": {
                  "playerCountEqual": True,
                  "currentAbilitySumEqual": True,
                  "potentialAbilityRawSumEqual": True,
                  "positionRatingSumEqual": True,
                  "rawAttributeSumEqual": True,
                  "feetSumEqual": True,
                  "transferValueSumEqual": True,
                  "sharpnessSumEqual": True,
                  "conditionSumEqual": True,
                  "heightSumEqual": True,
                  "personDecodedEqual": True,
                  "nameHashEqual": True,
                  "birthDateEqual": True,
                  "nationEqual": True,
                  "personalityEqual": True,
                  "traitBitsEqual": True,
                  "clubsEqual": True,
                  "clubNamesEqual": True,
                  "teamResolutionEqual": True,
                  "affiliateResolutionEqual": True,
                  "contractCountEqual": True,
                  "contractWageEqual": True,
                  "contractDatesEqual": True,
                  "contractSquadStatusEqual": True,
                  "contractClubEqual": True,
                  "managedSnapshotCountEqual": True,
                  "managedSnapshotCoreHashEqual": True,
              },
          }
          (root / "comparison.json").write_text(json.dumps(comparison, indent=2))
          print(json.dumps(comparison, indent=2))
          PY

      - name: Remove original save
        if: always()
        run: rm -f /tmp/fm26-rust-bench/public.fm

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-parser-benchmark
          path: |
            /tmp/fm26-rust-bench/python.json
            /tmp/fm26-rust-bench/python-players.json
            /tmp/fm26-rust-bench/rust.json
            /tmp/fm26-rust-bench/comparison.json
            /tmp/fm26-rust-bench/rust-snapshot.json
          if-no-files-found: warn
          retention-days: 7
